# Mosquitto broker for soil telemetry (dev defaults).
# Telemetry topic: LPA/test/nyawit (see MQTT_TOPIC env).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true

# --- Production hardening (uncomment + provide passwd file) ---
# allow_anonymous false
# password_file /mosquitto/config/passwd
# listener 8883
# certfile /mosquitto/config/cert.pem
# keyfile /mosquitto/config/key.pem
# Generate users with: mosquitto_passwd -c passwd <username>
