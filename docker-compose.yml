services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_TOPIC=${MQTT_TOPIC:-LPA/test/nyawit}
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  mqtt-ingest:
    build:
      context: .
      dockerfile: Dockerfile.mqtt-ingest
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_TOPIC=${MQTT_TOPIC:-LPA/test/nyawit}
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - mosquitto

volumes:
  mosquitto-data:
